<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIPS TMS</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #ffffff;
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block;
        }
    </style>
    <script>
        // 1. Читаем ссылку и ищем параметр ?key=
        const urlParams = new URLSearchParams(window.location.search);
        const secretKey = urlParams.get('key');

        // 2. Если ключа нет или он не совпадает с pips2026 — блокируем страницу
        if (secretKey !== 'pips2026') {
            window.stop(); 
            document.documentElement.innerHTML = '<h2 style="text-align:center; margin-top:50px; font-family:sans-serif; color:#d32f2f;">403 Forbidden / Доступ закрыт</h2>';
        }
    </script>
</head>
<body>
    <!-- ВСТАВЬ СЮДА СВОЮ НОВУЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (которая заканчивается на /exec) -->
    <iframe src="https://script.google.com/macros/s/AKfycbx_XeELeohImHLC5iAWOSX0pk7u6hefrlyVpRmetXypmB4t14Xa0bYXqiFRmvWt7t3b-g/exec"></iframe>
</body>
</html>
